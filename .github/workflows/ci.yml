name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Forbidden files and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fail if game data, legacy source, original art or frames are tracked
        run: python ci/check_forbidden.py

      - name: Test forbidden-file rules and local input exclusions
        run: python -m unittest ci.test_check_forbidden

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test with synthetic inputs only
        run: cargo test --workspace --locked

      - name: Build tool and experimental playable binary
        run: cargo build --release --locked -p ffe-tools -p ffe-rs

  # Later phases will add:
  # - golden: deterministic traces on the base game only
  # - docs: link/documentation checks
  # - release: tag-triggered ffe-rs-<tag>-windows-x64.zip (no game data, no data.bin)
