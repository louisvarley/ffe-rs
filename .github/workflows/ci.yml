name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Forbidden files and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fail if game data, legacy source, original art or frames are tracked
        run: python ci/check_forbidden.py

      - name: Check that upscaled.bin is routed through Git LFS
        run: |
          set -euo pipefail
          attr="$(git check-attr filter -- upscaled.bin)"
          echo "$attr"
          case "$attr" in
            *": lfs") ;;
            *) echo "upscaled.bin is not marked filter=lfs in .gitattributes" >&2; exit 1 ;;
          esac
          if git lfs ls-files 2>/dev/null | grep -q 'upscaled.bin'; then
            echo "upscaled.bin is an LFS object"
          else
            echo "note: upscaled.bin is not present yet (Phase 6); attribute is configured"
          fi

  # Phase 1+ will add:
  # - rust: cargo fmt --check, cargo clippy -- -D warnings, cargo test
  # - golden: deterministic traces on the base game only
  # - docs: link/documentation checks
  # - release: tag-triggered ffe-rs-<tag>-windows-x64.zip (no game data, no data.bin)
