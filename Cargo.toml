[workspace]
members = [
    "crates/ffe-rs",
    "crates/ffe-core",
    "crates/ffe-content",
    "crates/ffe-convert",
    "crates/ffe-tools",
    "crates/ffe-audio",
    "crates/ffe-render",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
