[package]
name = "ffe-rs"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Experimental playable native Rust First Encounters development slice"

[dependencies]
ffe-core = { path = "../ffe-core" }
ffe-content = { path = "../ffe-content" }
ffe-audio = { path = "../ffe-audio" }
ffe-render = { path = "../ffe-render" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
minifb = { version = "0.28", default-features = false, features = ["x11"] }
png = "0.17"

[dev-dependencies]
ffe-convert = { path = "../ffe-convert" }
tempfile = "3"
