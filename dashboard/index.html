<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ffe-rs burndown</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #171d26;
    --line: #2a3442;
    --text: #d8e0ea;
    --muted: #8a97a8;
    --done: #4cc38a;
    --remaining: #f2994a;
    --ideal: #5b7fa6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .card {
    flex: 1 1 150px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .card .value small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 18px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend span::before {
    content: ""; display: inline-block; width: 18px; height: 3px;
    margin-right: 6px; vertical-align: middle; background: currentColor;
  }
  .legend .r::before { background: var(--remaining); }
  .legend .i::before { background: var(--ideal); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td:last-child, th:last-child { text-align: right; }
  .status { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .status.done { color: var(--done); border-color: #2d5a44; }
  .status.in-progress { color: var(--remaining); border-color: #5a4327; }
  .warn { color: #e8c547; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  code { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1 id="title">ffe-rs burndown</h1>
  <div class="sub" id="sub"></div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>Remaining work over time</h2>
    <svg id="chart" viewBox="0 0 900 320" role="img" aria-label="Burndown chart"></svg>
    <div class="legend">
      <span class="r">Remaining</span>
      <span class="i">Ideal (linear to zero)</span>
    </div>
    <p id="warning" class="warn"></p>
  </div>

  <div class="panel">
    <h2>Work items</h2>
    <table>
      <thead><tr><th>Item</th><th>Status</th><th>Landed</th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </div>

  <footer>
    Source: <code>dashboard/burndown.js</code>. Append a dated point and update
    the statuses whenever a build changes progress (see
    <code>dashboard/README.md</code>).
  </footer>
</main>
<script src="burndown.js"></script>
<script>
(function () {
  const data = window.FFE_BURNDOWN;
  if (!data) return;

  const days = data.history.map(p => Date.parse(p.date + "T00:00:00Z"));
  const first = days[0], last = days[days.length - 1];
  const span = Math.max(1, (last - first) / 86400000);
  const total = data.tasks.length;
  const done = data.tasks.filter(t => t.status === "done").length;
  const remaining = total - done;
  const latest = data.history[data.history.length - 1].remaining;
  const rate = (data.history[0].remaining - latest) / span;
  const perDay = rate > 0 ? rate.toFixed(2) : "0";
  const projection = rate > 0 ? Math.ceil(remaining / rate) + " days" : "—";

  document.title = data.milestone + " — burndown";
  document.getElementById("title").textContent = data.project + " — " + data.milestone;
  document.getElementById("sub").textContent =
    total + " " + data.unit + " · updated " + data.updated;

  const cards = [
    ["Remaining", remaining + " <small>of " + total + "</small>"],
    ["Done", done + " <small>items</small>"],
    ["Burn rate", perDay + " <small>items/day</small>"],
    ["At this rate", projection]
  ];
  document.getElementById("cards").innerHTML = cards.map(([label, value]) =>
    '<div class="card"><div class="label">' + label + '</div>' +
    '<div class="value">' + value + '</div></div>').join("");

  // Chart geometry.
  const W = 900, H = 320, L = 46, R = 18, T = 16, B = 34;
  const maxY = Math.max(total, ...data.history.map(p => p.remaining), 1);
  const x = i => L + (i * (W - L - R)) / Math.max(1, days.length - 1);
  const y = v => T + (1 - v / maxY) * (H - T - B);
  const pts = data.history.map((p, i) => [x(i), y(p.remaining)]);
  const ideal = [[L, y(maxY)], [x(days.length - 1), y(0)]];
  const path = list => list.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");

  let svg = "";
  // Horizontal gridlines and y labels.
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const value = Math.round((maxY * s) / steps);
    const gy = y(value);
    svg += '<line x1="' + L + '" y1="' + gy + '" x2="' + (W - R) + '" y2="' + gy +
      '" stroke="#2a3442" stroke-width="1"/>' +
      '<text x="' + (L - 8) + '" y="' + (gy + 4) + '" fill="#8a97a8" font-size="11" text-anchor="end">' +
      value + "</text>";
  }
  // x labels (one per history point).
  data.history.forEach((p, i) => {
    svg += '<text x="' + x(i) + '" y="' + (H - 12) + '" fill="#8a97a8" font-size="11" text-anchor="middle">' +
      p.date.slice(5) + "</text>";
  });
  svg += '<path d="' + path(ideal) + '" fill="none" stroke="#5b7fa6" stroke-width="1.5" stroke-dasharray="5 4"/>';
  svg += '<path d="' + path(pts) + '" fill="none" stroke="#f2994a" stroke-width="2.5"/>';
  pts.forEach((p, i) => {
    svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#f2994a">' +
      "<title>" + data.history[i].date + ": " + data.history[i].remaining + " remaining — " +
      data.history[i].note + "</title></circle>";
  });
  document.getElementById("chart").innerHTML = svg;

  if (latest !== remaining) {
    document.getElementById("warning").textContent =
      "History's last point says " + latest + " remaining, but the task list says " +
      remaining + ". Append or correct the history point.";
  }

  document.getElementById("tasks").innerHTML = data.tasks.map(t =>
    "<tr><td>" + t.title + "</td>" +
    '<td><span class="status ' + t.status + '">' + t.status + "</span></td>" +
    "<td>" + (t.version || "") + "</td></tr>").join("");
})();
</script>
</body>
</html>
