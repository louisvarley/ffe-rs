<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ffe-rs burndown</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #171d26;
    --line: #2a3442;
    --text: #d8e0ea;
    --muted: #8a97a8;
    --done: #4cc38a;
    --progress: #f2994a;
    --todo: #7b8798;
    --ideal: #5b7fa6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .card {
    flex: 1 1 150px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .card .value small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
  }
  .mshead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .mshead h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .mshead .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 10px; }
  .bar i { display: block; height: 100%; background: var(--done); }
  .status { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .status.done { color: var(--done); border-color: #2d5a44; }
  .status.in-progress { color: var(--progress); border-color: #5a4327; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li {
    display: flex; gap: 8px; align-items: baseline;
    padding: 3px 0; border-bottom: 1px dashed #202834; font-size: 13px;
  }
  ul.items li:last-child { border-bottom: 0; }
  ul.items .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--todo); }
  ul.items .dot.done { background: var(--done); }
  ul.items .dot.in-progress { background: var(--progress); }
  ul.items .note { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 18px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend span::before {
    content: ""; display: inline-block; width: 18px; height: 3px;
    margin-right: 6px; vertical-align: middle; background: currentColor;
  }
  .legend .r::before { background: var(--progress); }
  .legend .i::before { background: var(--ideal); }
  .warn { color: #e8c547; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  code { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1 id="title">ffe-rs burndown</h1>
  <div class="sub" id="sub"></div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2 style="font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600">Remaining work over time</h2>
    <svg id="chart" viewBox="0 0 900 320" role="img" aria-label="Burndown chart"></svg>
    <div class="legend">
      <span class="r">Remaining</span>
    </div>
    <p id="warning" class="warn"></p>
  </div>

  <div id="milestones"></div>

  <footer>
    Source: <code>dashboard/burndown.js</code>. Append a dated point and update
    the statuses whenever a build changes progress (see
    <code>dashboard/README.md</code>).
  </footer>
</main>
<script src="burndown.js"></script>
<script>
(function () {
  const data = window.FFE_BURNDOWN;
  if (!data) return;

  const milestones = data.milestones || [];
  const all = milestones.flatMap(m => m.tasks.map(t => ({ milestone: m.id, ...t })));
  const total = all.length;
  const done = all.filter(t => t.status === "done").length;
  const remaining = total - done;
  const days = data.history.map(p => Date.parse(p.date + "T00:00:00Z"));
  const latest = data.history[data.history.length - 1].remaining;
  const percentDone = Math.round((100 * done) / Math.max(1, total));
  const inProgress = all.filter(t => t.status === "in-progress").length;

  document.title = "ffe-rs — burndown";
  document.getElementById("title").textContent = data.project + " — port completion";
  document.getElementById("sub").textContent =
    total + " " + data.unit + " across " + milestones.length + " milestones, from the first commit to a finished like-for-like port · updated " + data.updated;

  const cards = [
    ["Remaining", remaining + " <small>of " + total + "</small>"],
    ["Done", done + " <small>items</small>"],
    ["Overall", percentDone + "<small>% to a finished port</small>"],
    ["In progress", inProgress + " <small>items</small>"]
  ];
  document.getElementById("cards").innerHTML = cards.map(([label, value]) =>
    '<div class="card"><div class="label">' + label + '</div>' +
    '<div class="value">' + value + '</div></div>').join("");

  // Chart.
  const W = 900, H = 320, L = 46, R = 18, T = 16, B = 34;
  const maxY = Math.max(total, ...data.history.map(p => p.remaining), 1);
  const x = i => L + (i * (W - L - R)) / Math.max(1, days.length - 1);
  const y = v => T + (1 - v / maxY) * (H - T - B);
  const path = list => list.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  let svg = "";
  for (let s = 0; s <= 4; s++) {
    const value = Math.round((maxY * s) / 4), gy = y(value);
    svg += '<line x1="' + L + '" y1="' + gy + '" x2="' + (W - R) + '" y2="' + gy +
      '" stroke="#2a3442" stroke-width="1"/>' +
      '<text x="' + (L - 8) + '" y="' + (gy + 4) + '" fill="#8a97a8" font-size="11" text-anchor="end">' +
      value + "</text>";
  }
  data.history.forEach((p, i) => {
    svg += '<text x="' + x(i) + '" y="' + (H - 12) + '" fill="#8a97a8" font-size="11" text-anchor="middle">' +
      p.date.slice(5) + "</text>";
  });
  svg += '<path d="' + path(data.history.map((p, i) => [x(i), y(p.remaining)])) +
    '" fill="none" stroke="#f2994a" stroke-width="2.5"/>';
  data.history.forEach((p, i) => {
    svg += '<circle cx="' + x(i) + '" cy="' + y(p.remaining) + '" r="4" fill="#f2994a">' +
      "<title>" + p.date + ": " + p.remaining + " remaining — " + p.note + "</title></circle>";
  });
  document.getElementById("chart").innerHTML = svg;
  if (latest !== remaining) {
    document.getElementById("warning").textContent =
      "History's last point says " + latest + " remaining, but the task lists say " +
      remaining + ". Append or correct the history point.";
  }

  // Milestones.
  document.getElementById("milestones").innerHTML = milestones.map(m => {
    const finished = m.tasks.filter(t => t.status === "done").length;
    const percent = m.tasks.length ? Math.round((100 * finished) / m.tasks.length) : 0;
    return '<section class="panel">' +
      '<div class="mshead"><h2>' + m.title + '</h2>' +
      '<span class="status ' + m.status + '">' + m.status + '</span>' +
      '<span class="count">' + finished + "/" + m.tasks.length + " · " + percent + "%</span></div>" +
      '<div class="bar"><i style="width:' + percent + '%"></i></div>' +
      '<ul class="items">' + m.tasks.map(t =>
        '<li><span class="dot ' + t.status + '"></span><span>' + t.title + "</span>" +
        '<span class="note">' + (t.version || (t.status === "todo" ? "" : t.status)) + "</span></li>"
      ).join("") + "</ul></section>";
  }).join("");
})();
</script>
</body>
</html>
